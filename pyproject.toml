[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataclean"
version = "0.1.0"
description = "Reproducible data cleaning pipeline (CSV/JSON) with explicit exit codes and run manifest"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "zhy314" }]
keywords = ["data-cleaning", "pipeline", "cli", "pandas"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=1.5",
    "click>=8.1",
    "pyyaml>=6.0",
    "chardet>=5.0",
]

[project.optional-dependencies]
hf = ["datasets>=2.14"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
dataclean = "dataclean.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
